name: conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m conformance.run
      - run: python -m conformance.trace
      - run: python scripts/check_pcp_schemas.py
      - run: git diff --check
      - name: Release scans
        if: runner.os == 'Linux'
        run: |
          bash scripts/leak-scan.sh .
          bash scripts/test-leak-scan.sh
