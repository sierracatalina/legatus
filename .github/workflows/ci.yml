name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: protocol (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: conformance cases
        run: python -m conformance.run
      - name: grant-disclosure-execution trace
        run: python -m conformance.trace

  release-scan:
    name: public release scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan repository
        run: bash scripts/leak-scan.sh .
      - name: scanner regression
        run: bash scripts/test-leak-scan.sh
